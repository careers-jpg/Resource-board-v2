<style>
:root{--paper:#FAF7F0;--paper-2:#F2EDE2;--ink:#1C1B18;--ink-soft:#5A554B;--ink-faint:#928B7C;--line:#E2DACB;--line-strong:#CFC5B1;--accent:#0E5A52;--accent-soft:#0e5a521a;--free:#1f7a3d12;--shadow:0 1px 2px rgba(28,27,24,.04),0 8px 24px rgba(28,27,24,.06);--shadow-lg:0 4px 12px rgba(28,27,24,.08),0 24px 48px rgba(28,27,24,.14);--radius:10px}
*{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}.brand{display:flex;flex-direction:column;gap:2px}.brand .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}.brand h1{font-family:"Fraunces",serif;font-weight:500;font-size:34px;line-height:1;letter-spacing:-.01em}.brand h1 .edit{cursor:text;border-bottom:1.5px dashed transparent;padding-bottom:1px}.brand h1 .edit:hover{border-color:var(--line-strong)}.brand .sub{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s ease;white-space:nowrap}.btn:hover{border-color:var(--ink-soft);background:var(--paper-2)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.accent:hover{background:#0b463f}.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px}.btn.ghost:hover{background:var(--paper-2);color:var(--ink)}.btn svg{width:15px;height:15px;stroke-width:2}.btn.sm{padding:6px 10px;font-size:12px}

.board-wrap{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:auto}table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}table.board th,table.board td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}table.board thead th{position:sticky;top:0;z-index:6;background:var(--paper-2)}.col-name{position:sticky;left:0;z-index:5;background:#fff;min-width:178px;max-width:178px;width:178px}thead .col-name{z-index:8;background:var(--paper-2)}.wk-head{font-family:"Fraunces",serif;font-weight:500;font-size:13px;color:var(--ink);text-align:left;padding:9px 12px;letter-spacing:.01em;border-bottom:1px solid var(--line-strong)!important}.day-head{padding:7px 4px 8px;text-align:center;min-width:62px;vertical-align:middle}.day-head .dow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}.day-head .dnum{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;margin-top:1px}.day-head.today{background:var(--accent)}.day-head.today .dow,.day-head.today .dnum{color:#fff}.day-head.weekend{background:#efe9dc}th.col-name.corner{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:left;padding:0 12px}
tr.role-row td{background:var(--paper-2);border-bottom:1px solid var(--line-strong);padding:5px 12px}tr.role-row .col-name{background:var(--paper-2);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}.person-cell{padding:0 12px;height:46px}.person-cell .pname{font-weight:600;font-size:13.5px;color:var(--ink)}td.day-cell{height:46px;padding:3px;text-align:center;vertical-align:middle;cursor:pointer;position:relative;transition:background .12s}td.day-cell:hover{background:var(--accent-soft)}td.day-cell.weekend{background:#faf7ef}td.day-cell.free{background:var(--free)}td.day-cell.free:hover{background:var(--accent-soft)}td.day-cell.absent{background:#d9d5cb!important}td.day-cell.absent:hover{background:#d0ccc0!important}td.day-cell.today-col{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}td.day-cell.drag-preview{background:#0e5a5226!important;box-shadow:inset 0 0 0 2px var(--accent)}.chips{display:flex;flex-direction:column;gap:3px;justify-content:center;align-items:center}.chip-wrap{position:relative;display:inline-flex;align-items:center;max-width:100%}.chip{font-size:10.5px;font-weight:600;color:#fff;padding:2px 7px;border-radius:5px;line-height:1.3;white-space:nowrap;letter-spacing:.01em;max-width:96px;overflow:hidden;text-overflow:ellipsis}.chip.dim{opacity:.18}.resize-handle{position:absolute;top:50%;width:16px;height:21px;transform:translateY(-50%);border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--accent);font-size:15px;font-weight:700;line-height:17px;display:grid;place-items:center;cursor:ew-resize;opacity:0;z-index:4;box-shadow:0 2px 6px rgba(28,27,24,.12);transition:opacity .12s}.resize-handle.left{left:-19px}.resize-handle.right{right:-19px}.chip-wrap:hover .resize-handle,td.day-cell:hover .resize-handle,.resize-handle:focus{opacity:1}.cell-plus{opacity:0;color:var(--ink-faint);font-size:16px;font-weight:400;transition:opacity .12s}td.day-cell:hover .cell-plus{opacity:.6}.readonly td.day-cell{cursor:default}.readonly td.day-cell:hover{background:transparent}.readonly td.day-cell.free:hover{background:var(--free)}.readonly .cell-plus,.readonly .resize-handle{display:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:16px}.legend .lg-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}.legend .lg-item{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:3px 4px;border-radius:6px;transition:.12s}.legend .lg-item:hover{color:var(--ink)}.legend .lg-item.active{color:var(--ink);background:var(--paper-2)}.legend .sw{width:12px;height:12px;border-radius:4px;flex:none}.legend .lg-count{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}.footnote{margin-top:18px;color:var(--ink-faint);font-size:11.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
.milestones{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}.milestones-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.milestones h2{font-family:"Fraunces",serif;font-size:19px;font-weight:500}.milestones .hint{margin:0}.milestone-list{display:grid;gap:8px}.milestone-item{display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,2fr) auto;align-items:center;gap:12px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.milestone-project{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}.milestone-project .sw{width:10px;height:10px;border-radius:3px}.milestone-title{font-size:13px;color:var(--ink-soft)}.milestone-date{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}.milestone-empty{font-size:12.5px;color:var(--ink-faint);padding:3px 0}
.banner{display:none;align-items:center;gap:14px;background:#1C1B18;color:#fff;border-radius:var(--radius);padding:11px 16px;margin-bottom:16px;font-size:13px;box-shadow:var(--shadow)}.banner.show{display:flex}.banner .badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#ffffff22;padding:3px 8px;border-radius:5px;font-weight:600}.pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;min-width:230px;display:none}.pop.show{display:block;animation:popin .14s ease}@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}.pop .pop-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:4px 8px 7px}.pop .pop-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}.pop .pop-row:hover{background:var(--paper-2)}.pop .pop-row .sw{width:13px;height:13px;border-radius:4px;flex:none}.pop .pop-row .ck{margin-left:auto;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);display:grid;place-items:center}.pop .pop-row.on .ck{background:var(--accent);border-color:var(--accent)}.pop .pop-row.on .ck svg{display:block}.pop .pop-row .ck svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:3}.pop .pop-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 6px 3px;margin-top:4px;border-top:1px solid var(--line)}.link{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}.link:hover{background:var(--accent-soft)}
.overlay{position:fixed;inset:0;background:rgba(28,27,24,.35);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}.overlay.show{display:flex}.modal{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;overflow:hidden;animation:popin .18s ease}.modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}.modal .m-head h2{font-family:"Fraunces",serif;font-weight:500;font-size:22px}.modal .m-body{padding:4px 24px 20px;max-height:65vh;overflow:auto}.modal .m-foot{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);background:#fff}.row-edit{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row-edit input[type=text],.row-edit input[type=date]{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}.row-edit select{font-family:inherit;font-size:13px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 8px;background:#fff;color:var(--ink)}.swatches{display:flex;gap:5px;flex-wrap:wrap}.swatches .sw{width:20px;height:20px;border-radius:6px;cursor:pointer;border:2px solid transparent}.swatches .sw.sel{border-color:var(--ink)}.del{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:6px;display:grid;place-items:center}.del:hover{background:#e9483016;color:#c0392b}.del svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}.add-inline{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}.hint{color:var(--ink-faint);font-size:12px;margin:2px 0 10px;line-height:1.5}.copybox{display:flex;gap:8px;margin-top:10px}.copybox input{flex:1;font-family:inherit;font-size:12px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink-soft)}
@media print{body{background:#fff}.controls,.toolbar,.banner,.footnote,.legend .lg-add,.milestones .btn{display:none!important}.board-wrap,.milestones{box-shadow:none;border-color:#ccc}.app{padding:0;max-width:100%}}@media(max-width:640px){.brand h1{font-size:26px}.app{padding:18px 14px 60px}.milestone-item{grid-template-columns:1fr}.resize-handle.left{left:-14px}.resize-handle.right{right:-14px}}
</style>
</head>
<body>
<div class="app">
<div class="banner" id="banner"><span class="badge">View only</span><span><b>Shared board</b> — you're viewing a read-only snapshot.</span><span class="spacer"></span><button class="btn sm" id="makeCopyBtn">Make an editable copy</button></div>
<header class="top"><div class="brand"><span class="eyebrow">Strategy Team</span><h1><span class="edit" id="boardTitle">Resource Board</span></h1><span class="sub">Who's staffed on what — updated live</span></div><div class="toolbar" id="toolbar">
<button class="btn" id="peopleBtn">Team</button><button class="btn" id="projBtn">Projects</button><button class="btn ghost sm" id="printBtn">Print</button><button class="btn ghost sm" id="exportBtn">Export</button><button class="btn ghost sm" id="importBtn">Import</button><button class="btn accent" id="shareBtn">Share</button></div></header>
<div class="controls"><div class="nav"><button class="iconbtn" id="prevBtn" title="Previous week">‹</button><button class="btn sm" id="todayBtn">Today</button><button class="iconbtn" id="nextBtn" title="Next week">›</button><span class="range" id="rangeLabel"></span></div><span class="ctl-label">Weeks</span><div class="seg" id="weekSeg"><button data-w="2">2</button><button data-w="3">3</button><button data-w="4">4</button></div><div class="spacer"></div><label class="toggle"><input type="checkbox" id="weekendTog"><span class="switch"></span>Weekends</label><label class="toggle"><input type="checkbox" id="freeTog" checked><span class="switch"></span>Highlight free days</label></div>
<div class="board-wrap"><table class="board" id="board"></table></div><div class="legend" id="legend"></div><div class="footnote" id="footnote"></div>
<section class="milestones"><div class="milestones-head"><div><h2>Next project milestone</h2><p class="hint">Upcoming key moments across the active projects.</p></div><button class="btn sm" id="milestonesBtn">Manage milestones</button></div><div class="milestone-list" id="milestoneList"></div></section>
</div><div class="pop" id="pop"></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<script>
(function(){"use strict";
const LS_KEY="resourceBoard.v2",PALETTE=["#0E5A52","#B5562A","#3A5A8C","#7C6A9C","#5C7A3A","#A8862E","#9C3B4B","#2E7D86","#6B5B4A","#4A4A4A"];
const ROLE_ORDER=["Role 4","Role 2","Role 1","Intern"],ROLE_PLURAL={"Role 4":"Role 4","Role 2":"Role 2","Role 1":"Role 1",Intern:"Intern"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function uid(){return Math.random().toString(36).slice(2,9)} function lsGet(){try{return localStorage.getItem(LS_KEY)||localStorage.getItem("resourceBoard.v1")}catch(e){return null}} function lsSet(v){try{localStorage.setItem(LS_KEY,v)}catch(e){}}
function localISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`} function fromISO(s){return new Date(s+"T00:00:00")} function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x} function mondayOf(d){const x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
const todayISO=localISO();
function defaultState(){const alpha=uid(),beta=uid(),bd=uid(),abs=uid();return{title:"Resource Board",people:[{id:uid(),name:"Philip",role:"Role 4"},{id:uid(),name:"Karel",role:"Role 4"},{id:uid(),name:"Bart",role:"Role 4"},{id:uid(),name:"Audrey",role:"Role 2"},{id:uid(),name:"Kevin",role:"Role 2"},{id:uid(),name:"Rudi",role:"Role 2"},{id:uid(),name:"Michelle",role:"Role 1"},{id:uid(),name:"Emma",role:"Intern"}],projects:[{id:alpha,name:"Project Alpha",color:PALETTE[0]},{id:beta,name:"Project Beta",color:PALETTE[1]},{id:bd,name:"Business Dev",color:PALETTE[3]},{id:abs,name:"Absent",color:"#9a958c"}],assignments:{},milestones:[{id:uid(),projectId:alpha,title:"First steering committee",dueISO:localISO(addDays(new Date(),7))},{id:uid(),projectId:beta,title:"Draft deliverable",dueISO:localISO(addDays(new Date(),14))}],startISO:todayISO,weeks:3,weekends:false,highlightFree:true}}
function normalize(s){s=Object.assign(defaultState(),s||{});s.people=(s.people||[]).map(p=>{const role={Partner:"Role 4",Manager:"Role 2",Junior:"Role 1"}[p.role]||p.role;return Object.assign({},p,{role})});if(!s.people.some(p=>p.name==="Rudi"))s.people.push({id:uid(),name:"Rudi",role:"Role 2"});const junior=s.people.find(p=>p.name==="Junior");if(junior)junior.name="Michelle";const intern=s.people.find(p=>p.name==="Intern");if(intern)intern.name="Emma";(s.projects||[]).forEach(p=>{if(p.name.trim().toLowerCase()==="holiday")p.name="Absent"});if(!s.projects.some(p=>p.name.trim().toLowerCase()==="absent"))s.projects.push({id:uid(),name:"Absent",color:"#9a958c"});s.milestones=s.milestones||[];s.startISO=todayISO;return s}
function decodeHash(){const m=location.hash.match(/[#&]v=([^&]+)/);if(!m)return null;try{return JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}} function encodeState(s){return btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,'')}
let readOnly=false,focusProject=null,state;const shared=decodeHash();if(shared){state=normalize(shared);readOnly=true}else{const raw=lsGet();try{state=normalize(raw?JSON.parse(raw):null)}catch(e){state=defaultState()}save()}
function save(){if(!readOnly)lsSet(JSON.stringify(state))} function escapeHtml(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))} function key(pid,date){return pid+"|"+(date instanceof Date?localISO(date):date)} function projById(id){return state.projects.find(p=>p.id===id)} function isAbsent(id){const p=projById(id);return !!p&&p.name.trim().toLowerCase()==="absent"}
function visibleDays(){const start=fromISO(state.startISO),out=[];for(let i=0;i<state.weeks*7;i++){const dt=addDays(start,i),dow=(dt.getDay()+6)%7;if(state.weekends||dow<5)out.push(dt)}return out} function fmtRange(){const d=visibleDays();if(!d.length)return"";const a=d[0],b=d[d.length-1];return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`}
const board=document.getElementById("board"),pop=document.getElementById("pop"),overlay=document.getElementById("overlay"),modal=document.getElementById("modal");let popCell=null,drag=null;
function projectChip(pr,pid,date){const dim=focusProject&&focusProject!==pr.id?" dim":"";return `<span class="chip-wrap"><button class="resize-handle left" title="Drag to extend ${escapeHtml(pr.name)}" data-resize="left" data-project="${pr.id}" data-pid="${pid}" data-date="${date}">‹</button><span class="chip${dim}" style="background:${pr.color}" title="${escapeHtml(pr.name)}">${escapeHtml(pr.name)}</span><button class="resize-handle right" title="Drag to extend ${escapeHtml(pr.name)}" data-resize="right" data-project="${pr.id}" data-pid="${pid}" data-date="${date}">›</button></span>`}
function cellInner(pid,date,a){if(a.some(isAbsent))return"";if(!a.length)return`<span class="cell-plus">+</span>`;return `<div class="chips">${a.map(id=>{const pr=projById(id);return pr?projectChip(pr,pid,date):""}).join("")}</div>`}
function render(){document.getElementById("boardTitle").textContent=state.title;document.title=state.title;document.getElementById("rangeLabel").textContent=fmtRange();document.getElementById("weekendTog").checked=state.weekends;document.getElementById("freeTog").checked=state.highlightFree;document.querySelectorAll("#weekSeg button").forEach(b=>b.classList.toggle("on",+b.dataset.w===state.weeks));document.body.classList.toggle("readonly",readOnly);document.getElementById("banner").classList.toggle("show",readOnly);document.getElementById("toolbar").style.display=readOnly?"none":"flex";document.getElementById("milestonesBtn").style.display=readOnly?"none":"inline-flex";const days=visibleDays(),groups=[];days.forEach(dt=>{const mon=mondayOf(dt),k=localISO(mon);let g=groups.find(x=>x.key===k);if(!g){g={key:k,mon,count:0};groups.push(g)}g.count++});let h=`<thead><tr><th class="col-name corner" rowspan="2">Team / Week</th>`;groups.forEach(g=>h+=`<th class="wk-head" colspan="${g.count}">Week of ${g.mon.getDate()} ${MON[g.mon.getMonth()]}</th>`);h+=`</tr><tr>`;days.forEach(dt=>{const dow=(dt.getDay()+6)%7,cls=["day-head"];if(localISO(dt)===todayISO)cls.push("today");if(dow>=5)cls.push("weekend");h+=`<th class="${cls.join(" ")}"><div class="dow">${DOW[dow]}</div><div class="dnum">${dt.getDate()}</div></th>`});h+=`</tr></thead><tbody>`;ROLE_ORDER.forEach(role=>{const ppl=state.people.filter(p=>p.role===role);if(!ppl.length)return;h+=`<tr class="role-row"><td class="col-name">${ROLE_PLURAL[role]}</td><td colspan="${days.length}"></td></tr>`;ppl.forEach(p=>{h+=`<tr data-pid="${p.id}"><td class="col-name person-cell"><div class="pname">${escapeHtml(p.name)}</div></td>`;days.forEach(dt=>{const date=localISO(dt),dow=(dt.getDay()+6)%7,a=state.assignments[key(p.id,date)]||[],cls=["day-cell"];if(dow>=5)cls.push("weekend");if(date===todayISO)cls.push("today-col");if(!a.length&&state.highlightFree&&dow<5)cls.push("free");if(a.some(isAbsent))cls.push("absent");h+=`<td class="${cls.join(" ")}" data-pid="${p.id}" data-date="${date}">${cellInner(p.id,date,a)}</td>`});h+=`</tr>`})});board.innerHTML=h+`</tbody>`;renderLegend(days);renderFootnote(days);renderMilestones()}
function renderLegend(days){const counts={};days.forEach(dt=>state.people.forEach(p=>(state.assignments[key(p.id,dt)]||[]).forEach(id=>counts[id]=(counts[id]||0)+1)));let h=`<span class="lg-title">Projects</span>`;state.projects.forEach(pr=>h+=`<span class="lg-item${focusProject===pr.id?' active':''}" data-project="${pr.id}"><span class="sw" style="background:${pr.color}"></span>${escapeHtml(pr.name)} <span class="lg-count">${counts[pr.id]||0}</span></span>`);if(!readOnly)h+=`<span class="lg-item lg-add" id="legendAdd" style="color:var(--accent)">+ project</span>`;const el=document.getElementById("legend");el.innerHTML=h;el.querySelectorAll("[data-project]").forEach(x=>x.onclick=()=>{focusProject=focusProject===x.dataset.project?null:x.dataset.project;render()});const add=document.getElementById("legendAdd");if(add)add.onclick=openProjects}
function renderFootnote(days){const target=days.find(d=>localISO(d)===todayISO)||days[0];let free=0;if(target)state.people.forEach(p=>{const a=state.assignments[key(p.id,target)]||[];if(!a.length)free++});document.getElementById("footnote").innerHTML=`<span>${free} of ${state.people.length} available today</span><span class="dot"></span><span>Click a day to assign projects</span><span class="dot"></span><span>Drag a project arrow to extend it across days</span>`}
function renderMilestones(){const list=document.getElementById("milestoneList"),items=(state.milestones||[]).filter(m=>m.dueISO).sort((a,b)=>a.dueISO.localeCompare(b.dueISO)).slice(0,5);if(!items.length){list.innerHTML=`<div class="milestone-empty">No upcoming milestones added yet.</div>`;return}list.innerHTML=items.map(m=>{const pr=projById(m.projectId),d=fromISO(m.dueISO);return `<div class="milestone-item"><div class="milestone-project">${pr?`<span class="sw" style="background:${pr.color}"></span>${escapeHtml(pr.name)}`:"General"}</div><div class="milestone-title">${escapeHtml(m.title)}</div><div class="milestone-date">${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</div></div>`}).join("")}
function closePop(){pop.classList.remove("show");popCell=null} function openPop(td){if(readOnly)return;popCell=td;const pid=td.dataset.pid,date=td.dataset.date,cur=state.assignments[key(pid,date)]||[];pop.innerHTML=`<div class="pop-head">Assign projects</div>`+state.projects.map(pr=>`<div class="pop-row${cur.includes(pr.id)?' on':''}" data-project="${pr.id}"><span class="sw" style="background:${pr.color}"></span>${escapeHtml(pr.name)}<span class="ck"><svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></span></div>`).join("")+`<div class="pop-foot"><button class="link" id="popClear">Clear day</button><button class="link" id="popAddProj">+ New project</button></div>`;pop.classList.add("show");const r=td.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;let left=scrollX+r.left,top=scrollY+r.bottom+6;if(left+pw>scrollX+innerWidth-8)left=scrollX+innerWidth-pw-8;if(r.bottom+ph>innerHeight-8)top=scrollY+r.top-ph-6;pop.style.left=left+"px";pop.style.top=top+"px";pop.querySelectorAll(".pop-row").forEach(row=>row.onclick=()=>{toggleAssign(pid,date,row.dataset.project);closePop();render()});document.getElementById("popClear").onclick=()=>{delete state.assignments[key(pid,date)];save();closePop();render()};document.getElementById("popAddProj").onclick=()=>{closePop();openProjects()}}
function toggleAssign(pid,date,projectId){const k=key(pid,date);let a=state.assignments[k]||[];if(a.includes(projectId))a=a.filter(x=>x!==projectId);else if(isAbsent(projectId))a=[projectId];else a=[...a.filter(x=>!isAbsent(x)),projectId];if(a.length)state.assignments[k]=a;else delete state.assignments[k];save()}
function startResize(handle,e){if(readOnly)return;e.preventDefault();e.stopPropagation();closePop();drag={pid:handle.dataset.pid,projectId:handle.dataset.project,anchorDate:handle.dataset.date,cells:[]};updateResizeTarget(handle.closest("td.day-cell"));document.body.style.userSelect="none"}
function updateResizeTarget(td){if(!drag||!td||td.dataset.pid!==drag.pid)return;const row=td.closest("tr"),cells=[...row.querySelectorAll("td.day-cell")],a=cells.findIndex(x=>x.dataset.date===drag.anchorDate),b=cells.indexOf(td);if(a<0||b<0)return;document.querySelectorAll("td.drag-preview").forEach(x=>x.classList.remove("drag-preview"));drag.cells=cells.slice(Math.min(a,b),Math.max(a,b)+1);drag.cells.forEach(x=>x.classList.add("drag-preview"))}
function finishResize(){if(!drag)return;drag.cells.forEach(td=>{const k=key(drag.pid,td.dataset.date),cur=state.assignments[k]||[];if(!cur.includes(drag.projectId))state.assignments[k]=[...cur.filter(x=>!isAbsent(x)),drag.projectId]});document.querySelectorAll("td.drag-preview").forEach(x=>x.classList.remove("drag-preview"));drag=null;document.body.style.userSelect="";save();render()}
function closeModal(){overlay.classList.remove("show");modal.innerHTML=""} overlay.onclick=e=>{if(e.target===overlay)closeModal()};function trashSvg(){return `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`}
function openProjects(){modal.innerHTML=`<div class="m-head"><h2>Projects</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body"><p class="hint">Add the projects your team works on. “Absent” keeps its grey visual treatment.</p><div id="projList"></div><div class="add-inline"><input type="text" id="newProjName" placeholder="New project name…"><button class="btn accent" id="addProjBtn">Add</button></div></div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;overlay.classList.add("show");renderProjList();modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{closeModal();render()});const input=document.getElementById("newProjName");document.getElementById("addProjBtn").onclick=()=>{const name=input.value.trim();if(!name)return;state.projects.push({id:uid(),name,color:PALETTE[state.projects.length%PALETTE.length]});save();input.value="";renderProjList()}}
function renderProjList(){const wrap=document.getElementById("projList");wrap.innerHTML=state.projects.map(pr=>`<div class="row-edit" data-id="${pr.id}"><input type="text" class="p-name" value="${escapeHtml(pr.name)}"><div class="swatches">${PALETTE.map(c=>`<span class="sw${c===pr.color?' sel':''}" data-c="${c}" style="background:${c}"></span>`).join("")}</div><button class="del">${trashSvg()}</button></div>`).join("");wrap.querySelectorAll(".row-edit").forEach(row=>{const pr=projById(row.dataset.id);row.querySelector("input").oninput=e=>{pr.name=e.target.value;save()};row.querySelectorAll(".sw").forEach(sw=>sw.onclick=()=>{pr.color=sw.dataset.c;save();renderProjList()});row.querySelector(".del").onclick=()=>{if(!confirm(`Delete "${pr.name}"?`))return;state.projects=state.projects.filter(x=>x.id!==pr.id);Object.keys(state.assignments).forEach(k=>{state.assignments[k]=state.assignments[k].filter(x=>x!==pr.id);if(!state.assignments[k].length)delete state.assignments[k]});state.milestones=state.milestones.filter(m=>m.projectId!==pr.id);save();renderProjList()}})}
function openPeople(){modal.innerHTML=`<div class="m-head"><h2>Team</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body"><p class="hint">Edit names, change roles or add people.</p><div id="peopleList"></div><div class="add-inline"><input type="text" id="newPersonName" placeholder="New team member…"><select id="newPersonRole">${ROLE_ORDER.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn accent" id="addPersonBtn">Add</button></div></div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;overlay.classList.add("show");renderPeopleList();modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{closeModal();render()});document.getElementById("addPersonBtn").onclick=()=>{const name=document.getElementById("newPersonName").value.trim();if(!name)return;state.people.push({id:uid(),name,role:document.getElementById("newPersonRole").value});save();renderPeopleList()}}
function renderPeopleList(){const wrap=document.getElementById("peopleList"),ordered=[];ROLE_ORDER.forEach(r=>state.people.filter(p=>p.role===r).forEach(p=>ordered.push(p)));wrap.innerHTML=ordered.map(p=>`<div class="row-edit" data-id="${p.id}"><input type="text" value="${escapeHtml(p.name)}"><select>${ROLE_ORDER.map(r=>`<option${r===p.role?' selected':''}>${r}</option>`).join("")}</select><button class="del">${trashSvg()}</button></div>`).join("");wrap.querySelectorAll(".row-edit").forEach(row=>{const p=state.people.find(x=>x.id===row.dataset.id);row.querySelector("input").oninput=e=>{p.name=e.target.value;save()};row.querySelector("select").onchange=e=>{p.role=e.target.value;save();renderPeopleList()};row.querySelector(".del").onclick=()=>{if(!confirm(`Remove ${p.name}?`))return;state.people=state.people.filter(x=>x.id!==p.id);Object.keys(state.assignments).forEach(k=>{if(k.startsWith(p.id+"|"))delete state.assignments[k]});save();renderPeopleList()}})}
function openMilestones(){modal.innerHTML=`<div class="m-head"><h2>Next project milestones</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body"><p class="hint">Keep a compact view of the next important dates below the resource board.</p><div id="milestoneEditList"></div><div class="add-inline"><select id="newMilestoneProject">${state.projects.filter(p=>!isAbsent(p.id)).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select><input type="text" id="newMilestoneTitle" placeholder="Milestone"><input type="date" id="newMilestoneDate" value="${localISO(addDays(new Date(),7))}"><button class="btn accent" id="addMilestoneBtn">Add</button></div></div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;overlay.classList.add("show");renderMilestoneEditList();modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{closeModal();render()});document.getElementById("addMilestoneBtn").onclick=()=>{const title=document.getElementById("newMilestoneTitle").value.trim(),dueISO=document.getElementById("newMilestoneDate").value,projectId=document.getElementById("newMilestoneProject").value;if(!title||!dueISO)return;state.milestones.push({id:uid(),title,dueISO,projectId});save();renderMilestoneEditList();document.getElementById("newMilestoneTitle").value=""}}
function renderMilestoneEditList(){const wrap=document.getElementById("milestoneEditList");wrap.innerHTML=state.milestones.map(m=>`<div class="row-edit" data-id="${m.id}"><select class="m-project">${state.projects.filter(p=>!isAbsent(p.id)).map(p=>`<option value="${p.id}"${p.id===m.projectId?' selected':''}>${escapeHtml(p.name)}</option>`).join("")}</select><input class="m-title" type="text" value="${escapeHtml(m.title)}"><input class="m-date" type="date" value="${m.dueISO}"><button class="del">${trashSvg()}</button></div>`).join("");wrap.querySelectorAll(".row-edit").forEach(row=>{const m=state.milestones.find(x=>x.id===row.dataset.id);row.querySelector(".m-project").onchange=e=>{m.projectId=e.target.value;save()};row.querySelector(".m-title").oninput=e=>{m.title=e.target.value;save()};row.querySelector(".m-date").onchange=e=>{m.dueISO=e.target.value;save()};row.querySelector(".del").onclick=()=>{state.milestones=state.milestones.filter(x=>x.id!==m.id);save();renderMilestoneEditList()}})}
function openShare(){const url=location.origin+location.pathname+"#v="+encodeState(state);modal.innerHTML=`<div class="m-head"><h2>Share view-only link</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body"><p class="hint">This link contains a read-only snapshot of the current board.</p><div class="copybox"><input id="shareUrl" readonly value="${url.replace(/"/g,"&quot;")}"><button class="btn accent" id="copyBtn">Copy</button></div></div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;overlay.classList.add("show");modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);document.getElementById("copyBtn").onclick=()=>{const i=document.getElementById("shareUrl");i.select();navigator.clipboard?.writeText(i.value).catch(()=>document.execCommand("copy"))}}
function doExport(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="resource-board.json";a.click();URL.revokeObjectURL(a.href)} function doImport(file){const r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();render()}catch(e){alert("Could not read that file.")}};r.readAsText(file)}
board.addEventListener("click",e=>{if(e.target.closest(".resize-handle"))return;const td=e.target.closest("td.day-cell");if(td){e.stopPropagation();openPop(td)}});board.addEventListener("pointerdown",e=>{const h=e.target.closest(".resize-handle");if(h)startResize(h,e)});document.addEventListener("pointermove",e=>{if(!drag)return;updateResizeTarget(document.elementFromPoint(e.clientX,e.clientY)?.closest("td.day-cell"))});document.addEventListener("pointerup",finishResize);document.addEventListener("click",e=>{if(pop.classList.contains("show")&&!pop.contains(e.target)&&!e.target.closest("td.day-cell"))closePop()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();closeModal()}});
document.getElementById("prevBtn").onclick=()=>{state.startISO=localISO(addDays(fromISO(state.startISO),-7));save();render()};document.getElementById("nextBtn").onclick=()=>{state.startISO=localISO(addDays(fromISO(state.startISO),7));save();render()};document.getElementById("todayBtn").onclick=()=>{state.startISO=todayISO;save();render()};document.querySelectorAll("#weekSeg button").forEach(b=>b.onclick=()=>{state.weeks=+b.dataset.w;save();render()});document.getElementById("weekendTog").onchange=e=>{state.weekends=e.target.checked;save();render()};document.getElementById("freeTog").onchange=e=>{state.highlightFree=e.target.checked;save();render()};document.getElementById("peopleBtn").onclick=openPeople;document.getElementById("projBtn").onclick=openProjects;document.getElementById("milestonesBtn").onclick=openMilestones;document.getElementById("shareBtn").onclick=openShare;document.getElementById("printBtn").onclick=()=>print();document.getElementById("exportBtn").onclick=doExport;document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();document.getElementById("fileInput").onchange=e=>{if(e.target.files[0])doImport(e.target.files[0])};document.getElementById("makeCopyBtn").onclick=()=>{history.replaceState(null,"",location.pathname);readOnly=false;save();location.reload()};document.getElementById("boardTitle").onclick=e=>{if(readOnly)return;e.target.contentEditable="true";e.target.focus()};document.getElementById("boardTitle").onblur=e=>{if(readOnly)return;e.target.contentEditable="false";state.title=e.target.textContent.trim()||"Resource Board";save();render()};render();
})();
</script>
</body>
